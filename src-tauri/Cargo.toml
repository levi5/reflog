[package]
name = "reflog"
version = "0.1.0-beta.3"
description = "Reflog - Git client with conflict resolver"
authors = ["you"]
edition = "2021"
keywords = ["git", "git-client", "version-control", "conflict-resolution", "merge-tool", "diff-tool", "developer-tools", "tauri"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "reflog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-cli = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
