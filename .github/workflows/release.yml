name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
      - name: check version
        run: node scripts/check-version.mjs

  build:
    needs: verify
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: "--bundles deb,rpm,appimage"
          - platform: windows-latest
            bundles: "--bundles nsis"
            msi: "true"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm libfuse2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: check version and tag
        id: version
        run: node scripts/check-version.mjs --github-output
      - name: pick bundles
        id: bundles
        shell: bash
        run: |
          value="${{ matrix.bundles }}"
          if [ "${{ matrix.msi }}" = 'true' ] && [ "${{ steps.version.outputs.prerelease }}" = 'false' ]; then
            value="$value,msi"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "bundles: $value" >> "$GITHUB_STEP_SUMMARY"
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Reflog v__VERSION__"
          releaseBody: |
            AppImage, .deb and .rpm for Linux; -setup.exe for Windows (MSI is built only for final versions, WiX requires a numeric version).
          prerelease: ${{ steps.version.outputs.prerelease }}
          args: ${{ steps.bundles.outputs.value }}
          releaseAssetNamePattern: "[name]_[version]_[platform]_[arch][setup].[ext]"
          uploadWorkflowArtifacts: true
          retryAttempts: 2
      - name: list produced bundles
        if: always()
        shell: bash
        run: ls -laR src-tauri/target/release/bundle || true
      - name: upload bundles as run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: warn
          retention-days: 14